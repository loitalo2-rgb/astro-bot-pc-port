; ==============================================================================
; Configuração do Port / Recompilação: ASTRO BOT PC
; ==============================================================================

[Display]
; Resolução de renderização nativa do jogo:
; Opções válidas: 1080p (1920x1080), 2k (2432x1368 / 1440p), 4k (3840x2160)
Resolution = 1080p

; Modo de exibição: Borderless, Fullscreen, Windowed
WindowMode = Borderless

; V-Sync (Sincronização Vertical): true / false
VSync = true

; Limite de Taxa de Quadros (0 = Ilimitado, 60, 120, 144, 240)
FramerateLimit = 60

; Escala de Renderização Interna (Multiplicador de 0.5 a 2.0; 1.0 = Nativo)
InternalRenderScale = 1.0

[Patches]
; Forçar Renderizador Não-Tiled (Forced non-tiled deferred-lighting renderer)
ForceNonTiledDeferred = true

; Desativar Probes de Iluminação Global (Disabled GI probes)
DisableGiProbes = true

; Desativar Shaders de Iluminação de Alta Carga (Disabled lighting shaders)
DisableLightingShaders = true

; Forçar Perfil de Resolução no Executável (true = aplica na tabela de dados)
ApplyResolutionPatch = true

[Upscaling]
; AMD FidelityFX Super Resolution 4 (FSR 4)
EnableFSR4 = true
; Perfis de Qualidade: Native, Quality, Balanced, UltraPerformance
FSR4Quality = Balanced
; Nitidez RCAS (Robust Contrast Adaptive Sharpening): 0.0 a 1.0
RCASSharpening = 0.8

[Graphics]
; Backend gráfico: Vulkan (recomendado) ou D3D12
Renderer = Vulkan

; Índice da GPU (0 = Placa dedicada principal)
GPUIndex = 0

; Ativar camadas de validação (útil para debug): false para máxima performance
EnableValidationLayers = false

[Audio]
; Backend de áudio: WASAPI ou XAudio2
Backend = WASAPI

; Canais de áudio: 2 (Estéreo), 6 (5.1 Surround), 8 (7.1 Surround)
Channels = 2

; Volume Mestre (0 a 100)
MasterVolume = 100

[Input]
; Suporte ao controle DualSense nativo via USB/Bluetooth (Haptics e Gatilhos)
EnableDualSense = true

; Suporte nativo para controles Xbox (Xbox Series X|S, Xbox One, Xbox 360, XInput)
EnableXInput = true

; ------------------------------------------------------------------------------
; MAPEAMENTO DOS BOTÕES XBOX -> PLAYSTATION:
;   A               -> Cruz (X)           [Pulo / Ação Primária]
;   B               -> Círculo (O)        [Esquiva / Voltar / Cancelar]
;   X               -> Quadrado ([])      [Ataque / Soco / Interagir]
;   Y               -> Triângulo (△)      [Habilidade Especial]
;   LB (Bumper Esq) -> L1                 [Ação Secundária / Giro]
;   RB (Bumper Dir) -> R1                 [Ação Secundária / Dash]
;   LT (Gatilho Esq)-> L2 (Analógico)     [Mira / Foguete / Sucção]
;   RT (Gatilho Dir)-> R2 (Analógico)     [Aceleração / Fogo]
;   LS (Click Esq)  -> L3                 [Correr / Centralizar]
;   RS (Click Dir)  -> R3                 [Agachar / Câmera]
;   Start / Menu    -> Options            [Menu de Pausa]
;   Back / View     -> Touchpad / Share   [Mapa / Cartão]
;   D-Pad (C/B/E/D) -> D-Pad (C/B/E/D)    [Seleção / Gestos]
; ------------------------------------------------------------------------------

; Zona Morta Interna dos Sticks Analógicos (0.0 a 0.5 - evita drift)
XboxDeadZoneInner = 0.12

; Zona Morta Externa dos Sticks Analógicos (0.8 a 1.0 - saturação máxima)
XboxDeadZoneOuter = 0.95

; Ponto de ativação digital dos gatilhos analógicos LT/RT (0.0 a 1.0)
XboxTriggerThreshold = 0.15

; Intensidade da vibração / rumble dos motores do controle Xbox (0 a 100%)
XboxRumbleIntensity = 100

; Inverter eixo vertical da câmera no analógico direito (true / false)
XboxInvertRightY = false

[System]
; Pasta raiz dos dados extraídos do jogo (deve conter a subpasta "prein")
; Deixe vazio para procurar automaticamente em "<exe>/data" e "<exe>/game/data".
GameDataPath = D:/Games/abaixar/jogo/PPSA21567/data

; Caminho de redirecionamento dos dados salvos (Save Data local no PC)
SaveDataPath = ./savedata
