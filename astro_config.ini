[Graphics]
width = 2560
height = 1440
fullscreen = 1
vsync = 1
fps_limit = 60
perf_display = 0

[Upscaler]
backend = fsr41
quality = performance
sharpness = 85
frame_generation = 1

[Controls]
pad_type = xbox
trigger_state = 0
pad_motion = 1
rumble_scale = 100

[Engine_GPU]
shader_cache = 1
cache_title_id = PPSA21567
pipeline_prefetch = 1
pipeline_prewarm = 1
rt_software = auto
buffer_range_fixes = 1
commit_epoch_fastpath = 0

[CPU]
cp_priority = 2
draw_prep_priority = 2

