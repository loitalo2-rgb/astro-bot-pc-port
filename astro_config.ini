# ========================================================
# Astro Bot PC - Arquivo de Configuracao de Performance & Controles
# Desenvolvido por: @loitalo2-rgb
# ========================================================

[Graphics]
# Resolucao de Renderizacao (1920x1080, 2560x1440, 3840x2160)
width = 2560
height = 1440

# Modo de Tela Cheia (1 = Sim, 0 = Janela)
fullscreen = 1

# VSync (1 = Ativado, 0 = Desbloqueado para FreeSync/G-Sync)
vsync = 1

# Limite de Taxa de Quadros (60, 120, 144, 0 = Desbloqueado)
fps_limit = 60

# HUD de Performance Nativo da Engine (1 = Ativado, 0 = Desativado)
perf_display = 0

[Upscaler]
# Backend de Upscaling (fsr41, fsr31, xess, native)
backend = fsr41

# Modo de Qualidade (native_aa, ultra_quality, quality, balanced, performance, ultra_performance)
quality = quality

# Nitidez RCAS (Robust Contrast Adaptive Sharpening: 0 a 100)
sharpness = 85

# Frame Generation / Interpolacao de Quadros (1 = Ativado, 0 = Desativado)
frame_generation = 1

[Controls]
# Perfil de Controle (dualsense, xbox, switch, generic, keyboard)
pad_type = dualsense

# Gatilhos Adaptativos Dinamicos (1 = Ativado, 0 = Padrao)
trigger_state = 1

# Sensores de Movimento / Giroscopio (1 = Ativado, 0 = Desativado)
pad_motion = 1

# Escala de Vibracao / Rumble (0 a 200, padrao 100)
rumble_scale = 100

[Engine_GPU]
# Pipeline Cache Vulkan & Compilacao Antecipada de Shaders
shader_cache = 1
cache_title_id = PPSA21567
pipeline_prefetch = 1
pipeline_prewarm = 1
rt_software = auto
buffer_range_fixes = 1
commit_epoch_fastpath = 0

[CPU]
# Prioridade de Processamento para Intel Core i7-7700
cp_priority = 2
draw_prep_priority = 2
